
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100d29">
<title>مغامرة الكلمات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

:root{
 --bg:#100d29;
 --panel:#211b46;
 --gold:#ffd978;
 --purple:#8b70e8;
 --mint:#69e4bd;
 --white:#fff;
 --muted:#c2bbdf;
 --danger:#ff8294;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 color:var(--white);
 font-family:'Cairo',Tahoma,sans-serif;
 background:
 radial-gradient(ellipse at 15% 5%,#59439b66,transparent 35%),
 radial-gradient(ellipse at 90% 35%,#277c8b44,transparent 35%),
 linear-gradient(160deg,#171238,#0d0b22 70%);
 padding:14px;
 overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
.app{width:min(100%,560px);margin:auto}
.topbar{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin:5px 0 15px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:48px;height:48px;border-radius:16px;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#ffe9a5,#f4a94c);
 color:#382451;font-size:25px;font-weight:900;
 box-shadow:0 6px 22px #f4b34b55;
}
.brand h1{font-size:20px;margin:0;font-weight:900}
.brand small{display:block;color:var(--muted);font-size:11px}
.top-actions{display:flex;gap:7px}
.icon-btn{
 border:1px solid #ffffff25;background:#ffffff12;
 color:white;border-radius:13px;width:42px;height:42px;
 font-size:18px;
}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-bottom:12px;
}
.stat{
 border:1px solid #ffffff18;
 background:#ffffff0d;border-radius:15px;
 padding:9px 5px;text-align:center;
}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat strong{font-size:17px;color:var(--gold)}
.panel{
 background:linear-gradient(145deg,#292052eF,#1a1738f5);
 border:1px solid #ffffff20;border-radius:23px;
 padding:16px;margin-bottom:13px;
 box-shadow:0 12px 30px #0003;
}
.level-head{display:flex;justify-content:space-between;align-items:center}
.level-head h2{font-size:18px;margin:0}
.level-head span{color:var(--gold);font-size:13px}
.progress{
 height:9px;background:#ffffff16;border-radius:20px;
 overflow:hidden;margin:13px 0 7px;
}
.progress-fill{
 width:0;height:100%;
 background:linear-gradient(90deg,#58dcb5,#b1f5d7);
 border-radius:20px;transition:width .35s;
}
.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
#currentWord{
 height:42px;display:flex;align-items:center;justify-content:center;
 color:var(--gold);font-size:27px;font-weight:900;
 letter-spacing:5px;margin-top:5px;
}
.board-wrap{
 display:grid;place-items:center;padding:4px 0;
}
#board{
 width:min(82vw,330px);height:min(82vw,330px);
 max-width:330px;max-height:330px;
 position:relative;border-radius:50%;
 border:1px solid #ffffff20;
 background:
 radial-gradient(circle,#ffffff0c 0 35%,transparent 36%),
 radial-gradient(circle,#8c72e51a,transparent 68%);
 touch-action:none;
 user-select:none;
}
.letter{
 position:absolute;
 width:61px;height:61px;
 transform:translate(-50%,-50%);
 border:2px solid #fff8;
 border-radius:50%;
 background:linear-gradient(145deg,#ffe9a5,#f3ae50);
 color:#382451;
 font-size:25px;font-weight:900;
 box-shadow:0 7px 18px #0005,inset 0 2px 2px #fff9;
 display:grid;place-items:center;
 touch-action:none;user-select:none;
 transition:transform .12s,filter .12s;
}
.letter.selected{
 background:linear-gradient(145deg,#9effdc,#42cda5);
 transform:translate(-50%,-50%) scale(1.12);
 filter:brightness(1.1);
}
.letter.used{opacity:.55}
#message{
 min-height:28px;text-align:center;
 color:var(--gold);font-size:13px;font-weight:700;
 padding:5px;
}
.action-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.action{
 border:0;border-radius:13px;padding:10px 13px;
 font-size:12px;font-weight:800;
 background:linear-gradient(145deg,#ffe69b,#f4b451);
 color:#39254f;
 box-shadow:0 4px 12px #0002;
}
.action.secondary{
 background:#ffffff13;color:#fff;border:1px solid #ffffff25;
 box-shadow:none;
}
.action.mint{
 background:linear-gradient(145deg,#a1f6d9,#50d4aa);
}
.words-title{font-size:13px;color:var(--muted);margin:4px 0 10px}
#words{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.word-slot{
 background:#ffffff0c;border:1px dashed #ffffff30;
 border-radius:11px;padding:8px 3px;
 color:#aaa3c6;min-height:38px;
 font-size:13px;font-weight:700;
}
.word-slot.found{
 background:#1c705d66;border:1px solid #58dcb5;
 color:#a5f6dc;
 animation:pop .25s ease;
}
@keyframes pop{50%{transform:scale(1.06)}}
.section-title{font-size:16px;margin:0 0 12px}
.wheel-box{text-align:center}
.wheel{
 width:175px;height:175px;margin:8px auto 13px;
 border-radius:50%;
 border:7px solid #f9d77d;
 background:conic-gradient(
 #f4b34e 0deg 72deg,
 #8b70e8 72deg 144deg,
 #54cfa7 144deg 216deg,
 #e77b9b 216deg 288deg,
 #558edb 288deg 360deg
 );
 display:grid;place-items:center;
 box-shadow:0 0 25px #f5cb6c55;
 position:relative;
}
.wheel:after{
 content:"⭐";font-size:35px;
 background:#211b46;border-radius:50%;
 width:65px;height:65px;display:grid;place-items:center;
 border:3px solid #fff8;
}
.wheel.spinning{animation:spin 2s cubic-bezier(.15,.75,.2,1)}
@keyframes spin{to{transform:rotate(1080deg)}}
#levels{
 display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
}
.level-button{
 padding:9px 2px;border:1px solid #ffffff20;
 border-radius:10px;background:#ffffff10;color:#fff;
 font-weight:800;
}
.level-button.active{background:var(--gold);color:#39254f}
.level-button.done{background:#267c65;color:white}
.level-button:disabled{opacity:.25}
.overlay{
 position:fixed;inset:0;background:#08061bdc;
 display:none;align-items:center;justify-content:center;
 padding:18px;z-index:10;
}
.overlay.show{display:flex}
.modal{
 width:min(100%,390px);background:#241e49;
 border:1px solid #ffffff30;border-radius:23px;
 padding:22px;text-align:center;
 box-shadow:0 20px 60px #0009;
}
.modal h2{color:var(--gold);margin-top:0}
.modal p{color:#ddd6f3;font-size:14px;line-height:1.9}
.modal-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.toast{
 position:fixed;bottom:20px;left:50%;
 transform:translate(-50%,20px);
 background:#29234b;border:1px solid #ffffff30;
 color:white;border-radius:15px;padding:12px 18px;
 opacity:0;pointer-events:none;transition:.25s;
 z-index:20;font-size:13px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:#827ba6;font-size:11px;padding:8px}
@media(max-width:370px){
 .brand h1{font-size:16px}
 .letter{width:54px;height:54px;font-size:22px}
 .panel{padding:12px}
}
</style>
</head>
<body>
<div class="app">

<header class="topbar">
 <div class="brand">
  <div class="logo">م</div>
  <div>
   <h1>مغامرة الكلمات</h1>
   <small>اكتشف الكلمات وخض التحدي</small>
  </div>
 </div>
 <div class="top-actions">
  <button class="icon-btn" id="soundBtn" title="الصوت">🔊</button>
  <button class="icon-btn" id="helpBtn" title="المساعدة">؟</button>
 </div>
</header>

<section class="stats">
 <div class="stat"><small>النجوم</small><strong id="starCount">⭐ 10</strong></div>
 <div class="stat"><small>المرحلة</small><strong id="levelCount">1 / 100</strong></div>
 <div class="stat"><small>الكلمات</small><strong id="allWords">0</strong></div>
</section>

<main class="panel">
 <div class="level-head">
  <h2 id="levelTitle">المرحلة 1</h2>
  <span id="levelBadge">مبتدئ ✨</span>
 </div>
 <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
 <div class="progress-label">
  <span>تقدم المرحلة</span><span id="progressText">0%</span>
 </div>

 <div id="currentWord"></div>
 <div class="board-wrap"><div id="board"></div></div>

 <div id="message">اسحب الحروف لتكوين كلمة صحيحة!</div>

 <div class="action-row">
  <button class="action secondary" id="shuffleBtn">🔀 خلط</button>
  <button class="action" id="hintBtn">💡 تلميح 5 ⭐</button>
  <button class="action mint" id="revealBtn">🔓 كشف 22 ⭐</button>
 </div>
</main>

<section class="panel">
 <h3 class="section-title">📖 الكلمات المطلوبة</h3>
 <div id="words"></div>
</section>

<section class="panel wheel-box">
 <h3 class="section-title">🎡 عجلة الحظ اليومية</h3>
 <div class="wheel" id="wheel"></div>
 <div id="wheelTimer" class="words-title">العجلة جاهزة!</div>
 <button class="action" id="spinBtn">لف العجلة</button>
 <p id="wheelResult" class="words-title"></p>
</section>

<section class="panel">
 <h3 class="section-title">🗺️ خريطة المراحل</h3>
 <div id="levels"></div>
</section>

<footer>مغامرة الكلمات © 2026</footer>
</div>

<div class="overlay" id="modal">
 <div class="modal">
  <h2 id="modalTitle">مغامرة الكلمات</h2>
  <p id="modalText"></p>
  <div class="modal-actions">
   <button class="action" id="modalOk">حسناً</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================
   بيانات المراحل
========================================= */

const pools = [
 {l:["ك","ت","ا","ب","ر"],w:["كتاب","كاتب","ركب","ترك","كبر","برك","كرت"]},
 {l:["س","ل","ا","م","ن"],w:["سلام","سالم","لسان","نام","مال","نمل","لام"]},
 {l:["ق","ل","م","ا","ر"],w:["قلم","قمر","رقم","مرق","قال","رام","مال"]},
 {l:["ن","ج","م","و","ر"],w:["نجوم","نجم","نور","نوم","جرم","مرج","رجم"]},
 {l:["ح","ر","و","ب","م"],w:["حرب","حبر","مرح","روح","رمح","ربح"]},
 {l:["ب","ح","ر","س","م"],w:["بحر","سحر","رسم","مسح","حسم","حرس","سمح"]},
 {l:["ج","م","ا","ل","ن"],w:["جمال","جمل","مال","نام","نال","نمل","لام"]},
 {l:["و","ر","د","س","ع"],w:["ورد","درس","وعد","عدو","سرد","وسع","دور"]},
 {l:["ط","ر","ي","ق","م"],w:["طريق","طير","طرق","مرق","ريم","رقم","طقم"]},
 {l:["س","ف","ي","ن","ة"],w:["سفن","نفس","سيف","فني","نفي","سنة"]},
 {l:["م","د","ا","ر","س"],w:["درس","رسم","سرد","دسم","سمر","سدر","مدار"]},
 {l:["أ","ق","ل","ا","م"],w:["قلم","أمل","ألم","قال","مال","لام","مقال"]},
 {l:["ز","ه","و","ر","ك"],w:["زهر","زور","كور","كرز","روز","هور"]},
 {l:["ق","و","ا","ر","ب"],w:["قارب","قبر","بار","ربا","قرب","بور"]},
 {l:["ش","ع","ر","و","ا"],w:["شعر","عرش","شرع","عشر","روع","شراع"]},
 {l:["ح","د","ي","ق","ة"],w:["حدق","حقد","قيد","حق","دق","حي","قد"]},
 {l:["م","ف","ت","ا","ح"],w:["فتح","حتم","فحم","حام","مات","فاح"]},
 {l:["ن","ج","ا","ح","ك"],w:["نجاح","نجح","حج","حاج","حان","كنا"]},
 {l:["أ","ل","ع","ا","ب"],w:["لعب","أمل","بلا","بال","علم","لام"]},
 {l:["ص","ب","ر","و","ن"],w:["صبر","نصر","نصب","نور","صور","صون"]}
];

function canMake(word,letters){
 const available={};
 for(const c of letters)available[c]=(available[c]||0)+1;
 for(const c of [...word]){
  if(!available[c])return false;
  available[c]--;
 }
 return [...word].length>=2;
}

const stages=[];
pools.forEach((pool,poolIndex)=>{
 for(let variant=0;variant<5;variant++){
  const rotated=pool.w.map((_,i)=>pool.w[(i+variant)%pool.w.length]);
  const valid=rotated.filter(w=>canMake(w,pool.l));
  const count=Math.min(5+(variant%3),valid.length);
  stages.push({
   letters:[...pool.l],
   words:valid.slice(0,count),
   title:"المرحلة "+(stages.length+1),
   group:poolIndex+1
  });
 }
});

/* =========================================
   حالة اللعبة والحفظ
========================================= */

const $=id=>document.getElementById(id);
const SAVE_KEY="wordAdventureSave_v3";

function loadSave(){
 try{
  const data=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");
  return {
   level:Number.isInteger(data.level)?Math.max(0,Math.min(99,data.level)):0,
   stars:Number.isFinite(data.stars)?Math.max(0,data.stars):10,
   completed:Array.isArray(data.completed)?data.completed:[],
   totalFound:Number.isFinite(data.totalFound)?data.totalFound:0,
   lastSpin:Number.isFinite(data.lastSpin)?data.lastSpin:0
  };
 }catch(e){
  return {level:0,stars:10,completed:[],totalFound:0,lastSpin:0};
 }
}

let state=loadSave();
let level=state.level;
let stars=state.stars;
let completed=new Set(state.completed);
let totalFound=state.totalFound;
let lastSpin=state.lastSpin;
let found=[];
let selected=[];
let pointerActive=false;
let soundOn=true;
let toastTimer=null;

function save(){
 state={
  level,stars,
  completed:[...completed],
  totalFound,
  lastSpin
 };
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
 }catch(e){
  showToast("تعذر حفظ التقدم على هذا المتصفح");
 }
}

function showToast(text){
 const el=$("toast");
 el.textContent=text;
 el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

function setMessage(text){$("message").textContent=text}
function currentStage(){return stages[level]}
function updateStats(){
 $("starCount").textContent="⭐ "+stars;
 $("levelCount").textContent=(level+1)+" / "+stages.length;
 $("allWords").textContent=totalFound;
}

function playTone(freq=550){
 if(!soundOn)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new Ctx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.frequency.value=freq;
  osc.type="sine";
  gain.gain.value=.055;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);
  osc.stop(ctx.currentTime+.17);
 }catch(e){}
}

/* =========================================
   رسم لوحة الحروف
========================================= */

function shuffleArray(array){
 const copy=[...array];
 for(let i=copy.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [copy[i],copy[j]]=[copy[j],copy[i]];
 }
 return copy;
}

function clearSelection(){
 selected.forEach(item=>item.classList.remove("selected"));
 selected=[];
 $("currentWord").textContent="";
}

function chooseLetter(button){
 if(!pointerActive||selected.includes(button))return;
 selected.push(button);
 button.classList.add("selected");
 $("currentWord").textContent=selected.map(b=>b.textContent).join("");
 playTone(400+selected.length*45);
}

function drawBoard(){
 const board=$("board");
 board.innerHTML="";
 const letters=shuffleArray(currentStage().letters);
 const count=letters.length;
 const radius=39;

 letters.forEach((letter,index)=>{
  const angle=(index*2*Math.PI/count)-Math.PI/2;
  const button=document.createElement("button");
  button.className="letter";
  button.type="button";
  button.textContent=letter;
  button.style.left=(50+Math.cos(angle)*radius)+"%";
  button.style.top=(50+Math.sin(angle)*radius)+"%";
  button.setAttribute("aria-label","حرف "+letter);

  button.addEventListener("pointerdown",event=>{
   event.preventDefault();
   pointerActive=true;
   clearSelection();
   chooseLetter(button);
  });

  board.appendChild(button);
 });
}

document.addEventListener("pointermove",event=>{
 if(!pointerActive)return;
 const element=document.elementFromPoint(event.clientX,event.clientY);
 if(element&&element.classList.contains("letter"))chooseLetter(element);
});

document.addEventListener("pointerup",()=>{
 if(!pointerActive)return;
 pointerActive=false;
 submitWord();
});

document.addEventListener("pointercancel",()=>{
 pointerActive=false;
 clearSelection();
});

/* =========================================
   التحقق من الكلمات
========================================= */

function submitWord(){
 if(!selected.length)return;
 const word=selected.map(b=>b.textContent).join("");
 const stage=currentStage();

 if(found.includes(word)){
  setMessage("هذه الكلمة مكتشفة مسبقاً!");
  clearSelection();
  return;
 }

 if(stage.words.includes(word)){
  found.push(word);
  totalFound++;
  stars++;
  playTone(780);
  setMessage("رائع! وجدت كلمة جديدة ⭐");
  updateStats();
  renderWords();
  save();

  if(found.length===stage.words.length){
   setTimeout(completeLevel,650);
  }
 }else{
  playTone(180);
  setMessage("لم تتكوّن كلمة صحيحة، جرّب مرة أخرى.");
 }
 clearSelection();
}

function renderWords(){
 const container=$("words");
 container.innerHTML="";
 const stage=currentStage();

 stage.words.forEach(word=>{
  const item=document.createElement("div");
  item.className="word-slot";
  if(found.includes(word)){
   item.classList.add("found");
   item.textContent=word;
  }else{
   item.textContent="؟ ؟ ؟";
  }
  container.appendChild(item);
 });

 const percent=Math.round(found.length/stage.words.length*100);
 $("progressFill").style.width=percent+"%";
 $("progressText").textContent=percent+"%";
}

function startLevel(){
 found=[];
 clearSelection();
 const stage=currentStage();
 $("levelTitle").textContent=stage.title;
 $("levelBadge").textContent=level<10?"مبتدئ ✨":level<35?"مستكشف 🧭":level<70?"خبير 🏆":"أسطورة 👑";
 updateStats();
 drawBoard();
 renderWords();
 renderLevels();
}

/* =========================================
   الانتقال وإكمال المراحل
========================================= */

function completeLevel(){
 if(completed.has(level))return;
 completed.add(level);
 stars+=5;
 save();
 updateStats();
 renderLevels();

 if(level===stages.length-1){
  openModal("تهانينا! 👑","لقد أنهيت جميع المراحل! أنت بطل مغامرة الكلمات.");
  return;
 }

 openModal("مرحلة مكتملة! 🎉","أحسنت! حصلت على 5 نجوم إضافية. هل تريد الانتقال إلى المرحلة التالية؟");
}

function advanceLevel(){
 if(level<stages.length-1){
  level++;
  save();
  startLevel();
  setMessage("أهلاً بك في المرحلة "+(level+1)+"!");
 }else{
  showToast("لقد أكملت كل المراحل!");
 }
}

function openModal(title,text){
 $("modalTitle").textContent=title;
 $("modalText").textContent=text;
 $("modal").classList.add("show");
}

$("modalOk").addEventListener("click",()=>{
 $("modal").classList.remove("show");
 if(completed.has(level)&&level<stages.length-1)advanceLevel();
});

/* =========================================
   المساعدات
========================================= */

$("hintBtn").addEventListener("click",()=>{
 if(stars<5){
  setMessage("لا تملك نجومًا كافية للمساعدة.");
  return;
 }
 const word=currentStage().words.find(w=>!found.includes(w));
 if(!word){
  setMessage("اكتشفت جميع الكلمات!");
  return;
 }
 stars-=5;
 updateStats();
 save();
 setMessage("تلميح: الكلمة تبدأ بحرف "+word[0]);
});

$("revealBtn").addEventListener("click",()=>{
 if(stars<22){
  setMessage("تحتاج إلى 22 نجمة لكشف كلمة.");
  return;
 }
 const word=currentStage().words.find(w=>!found.includes(w));
 if(!word){
  setMessage("اكتشفت جميع الكلمات!");
  return;
 }
 stars-=22;
 found.push(word);
 totalFound++;
 updateStats();
 renderWords();
 save();
 playTone(800);
 setMessage("تم كشف كلمة: "+word);
 if(found.length===currentStage().words.length)setTimeout(completeLevel,650);
});

$("shuffleBtn").addEventListener("click",()=>{
 clearSelection();
 drawBoard();
 setMessage("تم خلط الحروف!");
});

/* =========================================
   خريطة المراحل
========================================= */

function renderLevels(){
 const container=$("levels");
 container.innerHTML="";

 stages.forEach((stage,index)=>{
  const button=document.createElement("button");
  button.className="level-button";
  button.textContent=index+1;

  if(completed.has(index))button.classList.add("done");
  if(index===level)button.classList.add("active");
  button.disabled=index>level&&!completed.has(index);

  button.addEventListener("click",()=>{
   if(index>level&&!completed.has(index))return;
   level=index;
   save();
   startLevel();
   setMessage("أنت الآن في "+stage.title);
   window.scrollTo({top:0,behavior:"smooth"});
  });

  container.appendChild(button);
 });
}

/* =========================================
   عجلة الحظ اليومية
========================================= */

const DAY=24*60*60*1000;

function updateWheelTimer(){
 const remaining=DAY-(Date.now()-lastSpin);
 if(remaining<=0){
  $("wheelTimer").textContent="العجلة جاهزة! 🎁";
  $("spinBtn").disabled=false;
  return;
 }
 const hours=Math.floor(remaining/3600000);
 const minutes=Math.floor((remaining%3600000)/60000);
 $("wheelTimer").textContent="متبقي "+hours+" ساعة و"+minutes+" دقيقة";
 $("spinBtn").disabled=true;
}

$("spinBtn").addEventListener("click",()=>{
 if(Date.now()-lastSpin<DAY){
  showToast("يمكنك استخدام العجلة مرة واحدة يومياً.");
  return;
 }

 const wheel=$("wheel");
 wheel.classList.remove("spinning");
 void wheel.offsetWidth;
 wheel.classList.add("spinning");

 $("spinBtn").disabled=true;

 setTimeout(()=>{
  const prizes=[0,1,3,5,10];
  const prize=prizes[Math.floor(Math.random()*prizes.length)];
  stars+=prize;
  lastSpin=Date.now();
  save();
  updateStats();
  updateWheelTimer();

  const result=prize===0?"حظ أوفر في المرة القادمة!":"مبروك! ربحت "+prize+" نجوم! ⭐";
  $("wheelResult").textContent=result;
  showToast(result);
  playTone(900);
 },2100);
});

/* =========================================
   الإعدادات والمساعدة
========================================= */

$("soundBtn").addEventListener("click",()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊":"🔇";
 showToast(soundOn?"تم تشغيل الصوت":"تم إيقاف الصوت");
});

$("helpBtn").addEventListener("click",()=>{
 openModal("كيف تلعب؟ 🎮",
 "اسحب إصبعك من حرف إلى حرف لتكوين كلمة. إذا كانت الكلمة صحيحة ستظهر في قائمة الكلمات وتحصل على نجمة. يمكنك استخدام التلميح مقابل 5 نجوم أو كشف كلمة مقابل 22 نجمة. أكمل كل الكلمات للانتقال إلى المرحلة التالية.");
});

/* =========================================
   تشغيل اللعبة
========================================= */

function initializeGame(){
 startLevel();
 updateWheelTimer();
 setInterval(updateWheelTimer,60000);
}

initializeGame();

</script>
